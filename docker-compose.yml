services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: njord
      POSTGRES_USER: njord
      POSTGRES_PASSWORD: ${NJORD_DB_PASSWORD:-njord}  # local-only dev default
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - njord-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U njord -d njord"]
      interval: 5s
      retries: 10

volumes:
  njord-db:
